name: pulse_mobile
description: Pulse — W&C Computer Limited internal operations platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.8.0+1

  # Auth storage
  flutter_secure_storage: ^9.2.4

  # Real-time chat
  socket_io_client: ^2.0.3+1

  # State management
  provider: ^6.1.5

  # Firebase
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  badges: ^3.1.2
  fluttertoast: ^8.2.12

  # Offline database
  drift: ^2.22.1
  drift_flutter: ^0.2.4

  # Utilities
  intl: ^0.20.2
  path_provider: ^2.1.5
  open_file: ^3.5.10
  file_picker: ^8.3.7
  timeago: ^3.7.0
  emoji_picker_flutter: ^3.1.0
  flutter_local_notifications: ^18.0.0
  url_launcher: ^6.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F2860"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
